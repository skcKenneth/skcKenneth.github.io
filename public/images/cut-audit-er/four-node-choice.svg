 <title id="cut-cover-title">Highest proxy score and highest expected gain choose different edges</title><desc id="cut-cover-description">Known-law constructed four-record path, not natural data. The three independent edge error probabilities are 0.35, 0.30, and 0.35. Panel a highlights the left endpoint edge with a blue solid line and circle: proxy 0.524475 and expected pair-error reduction 1.05. The right endpoint is tied. Panel b highlights the central edge with a vermillion dashed line and square: proxy 0.476550 and expected pair-error reduction 1.20. The budget is one verification.</desc><metadata>
