<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Finite-horizon harvest yield and extinction risk</title>
  <desc id="desc">A two-panel figure shows abrupt risk cliffs for fixed-quota and proportional harvesting, and a risk-yield comparison in which the tested threshold-adaptive rule reaches high yield without observed extinctions.</desc>
  <style>.t{fill:#111;font-family:Arial,Helvetica,sans-serif}.h{font-size:20px;font-weight:700}.ph{font-size:17px;font-weight:700}.s{font-size:14px}.a{stroke:#111;stroke-width:1.3}.g{stroke:#ced2ce;stroke-width:1}.q{fill:none;stroke:#a24b32;stroke-width:3}.p{fill:none;stroke:#777;stroke-width:3;stroke-dasharray:7 5}.r{fill:none;stroke:#1f6652;stroke-width:4}.mq{fill:#a24b32;stroke:#111}.mp{fill:#fff;stroke:#555;stroke-width:2}.mr{fill:#1f6652;stroke:#111}</style>
  <rect width="960" height="540" fill="#fff"/>
  <text class="t ph" x="48" y="29">(a) Small changes in control intensity</text>
  <text class="t ph" x="72" y="51">can trigger an abrupt jump in extinction risk</text>
  <line class="g" x1="80" y1="105" x2="445" y2="105"/><line class="g" x1="80" y1="265" x2="445" y2="265"/><line class="g" x1="80" y1="425" x2="445" y2="425"/>
  <line class="a" x1="80" y1="80" x2="80" y2="425"/><line class="a" x1="80" y1="425" x2="455" y2="425"/>
  <text class="t s" x="49" y="430">0.0</text><text class="t s" x="49" y="270">0.5</text><text class="t s" x="49" y="110">1.0</text><text class="t s" transform="translate(22 350) rotate(-90)">Extinction probability</text><text class="t s" x="190" y="466">Normalized control intensity</text>
  <path class="q" d="M180 425 L235 423 L290 365 L345 105"/><circle class="mq" cx="180" cy="425" r="6"/><circle class="mq" cx="235" cy="423" r="6"/><circle class="mq" cx="290" cy="365" r="6"/><circle class="mq" cx="345" cy="105" r="6"/>
  <path class="p" d="M200 425 L270 419 L330 105"/><circle class="mp" cx="200" cy="425" r="6"/><circle class="mp" cx="270" cy="419" r="6"/><circle class="mp" cx="330" cy="105" r="6"/>
  <path class="r" d="M170 425 L280 425 L410 425"/><rect class="mr" x="164" y="419" width="12" height="12"/><rect class="mr" x="274" y="419" width="12" height="12"/><rect class="mr" x="404" y="419" width="12" height="12"/>
  <text class="t s" x="338" y="92">fixed quota</text><text class="t s" x="328" y="130">proportional</text><text class="t s" x="300" y="407">threshold-adaptive</text>
  <text class="t ph" x="505" y="29">(b) Compare yield only after</text>
  <text class="t ph" x="529" y="51">screening for an acceptable level of risk</text>
  <line class="g" x1="530" y1="105" x2="900" y2="105"/><line class="g" x1="530" y1="265" x2="900" y2="265"/><line class="g" x1="530" y1="425" x2="900" y2="425"/>
  <line class="a" x1="530" y1="80" x2="530" y2="425"/><line class="a" x1="530" y1="425" x2="910" y2="425"/>
  <text class="t s" x="502" y="430">0</text><text class="t s" x="502" y="270">5</text><text class="t s" x="494" y="110">10</text><text class="t s" transform="translate(475 350) rotate(-90)">Mean yield per step</text><text class="t s" x="540" y="452">0</text><text class="t s" x="705" y="452">0.5</text><text class="t s" x="888" y="452">1</text><text class="t s" x="637" y="485">Extinction probability</text>
  <path class="q" d="M532 207 L600 196 L900 365"/><circle class="mq" cx="532" cy="207" r="7"/><circle class="mq" cx="600" cy="196" r="7"/><circle class="mq" cx="900" cy="365" r="7"/>
  <path class="p" d="M530 151 L537 144 L900 373"/><circle class="mp" cx="530" cy="151" r="7"/><circle class="mp" cx="537" cy="144" r="7"/><circle class="mp" cx="900" cy="373" r="7"/>
  <rect class="mr" x="525" y="91" width="14" height="14"/><text class="t s" x="551" y="99">threshold-adaptive: 10.27 yield, 0/150 extinctions</text>
</svg>
