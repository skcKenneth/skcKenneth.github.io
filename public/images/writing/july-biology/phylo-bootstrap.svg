<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Bootstrap confidence under a misspecified phylogenetic model</title>
  <desc id="desc">The same 5000-site alignment produces complete bootstrap support for the wrong AC versus BD split under JC69 and K80, and complete support for the true AB versus CD split under regularized log-det.</desc>
  <style>.t{fill:#111;font-family:Arial,Helvetica,sans-serif}.h{font-size:21px;font-weight:700}.s{font-size:15px}.box{fill:#f7f7f4;stroke:#777;stroke-width:1.2}.wrong{fill:#f3e6e0;stroke:#a24b32;stroke-width:2}.right{fill:#e6efea;stroke:#1f6652;stroke-width:2}.tree{stroke:#111;stroke-width:2;fill:none}.bar0{fill:#a24b32}.bar1{fill:#1f6652}</style>
  <rect width="960" height="540" fill="#fff"/>
  <text class="t h" x="52" y="42">Bootstrap stability is conditional on the analysis model</text>
  <rect class="box" x="55" y="82" width="850" height="72"/><text class="t h" x="85" y="113">One heterogeneous alignment</text><text class="t s" x="85" y="138">5,000 sites · seed 1729 · true split AB | CD</text>
  <line x1="480" y1="154" x2="480" y2="190" stroke="#111" stroke-width="2"/>
  <rect class="wrong" x="55" y="190" width="260" height="255"/><rect class="wrong" x="350" y="190" width="260" height="255"/><rect class="right" x="645" y="190" width="260" height="255"/>
  <text class="t h" x="85" y="225">JC69</text><text class="t h" x="380" y="225">K80</text><text class="t h" x="675" y="225">Regularized log-det</text>
  <path class="tree" d="M105 280 H155 M105 340 H155 M155 280 V340 M155 310 H235 M235 265 V355 M235 265 H275 M235 355 H275"/><text class="t s" x="80" y="285">A</text><text class="t s" x="80" y="345">C</text><text class="t s" x="280" y="270">B</text><text class="t s" x="280" y="360">D</text>
  <path class="tree" d="M400 280 H450 M400 340 H450 M450 280 V340 M450 310 H530 M530 265 V355 M530 265 H570 M530 355 H570"/><text class="t s" x="375" y="285">A</text><text class="t s" x="375" y="345">C</text><text class="t s" x="575" y="270">B</text><text class="t s" x="575" y="360">D</text>
  <path class="tree" d="M695 280 H745 M695 340 H745 M745 280 V340 M745 310 H825 M825 265 V355 M825 265 H865 M825 355 H865"/><text class="t s" x="670" y="285">A</text><text class="t s" x="670" y="345">B</text><text class="t s" x="870" y="270">C</text><text class="t s" x="870" y="360">D</text>
  <rect class="bar0" x="85" y="390" width="200" height="18"/><rect class="bar0" x="380" y="390" width="200" height="18"/><rect class="bar1" x="675" y="390" width="200" height="18"/>
  <text class="t s" x="85" y="430">100% support · wrong AC | BD</text><text class="t s" x="380" y="430">100% support · wrong AC | BD</text><text class="t s" x="675" y="430">100% support · true AB | CD</text>
  <text class="t s" x="215" y="495">Resampling measures repeatability inside a pipeline; it does not test whether the pipeline is adequate.</text>
</svg>
