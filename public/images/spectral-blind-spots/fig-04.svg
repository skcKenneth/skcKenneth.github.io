 <title id="fig-04-title">A multi-peak control</title><desc id="fig-04-desc">Saved eight-node control with probability 1/4 of one jump and 3/4 of seven jumps, r=1 and d=1/4. The lower panel zooms to times 1 through 9 and derivative values -0.012 through 0.03 to reveal repeated sign changes. Global peak and first-crossing certificates are stored independently of the plotted grid.</desc><title>A multi-peak control</title>
 <metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>A multi-peak control</dc:title>
    <dc:description>Saved eight-node control with probability 1/4 of one jump and 3/4 of seven jumps, r=1 and d=1/4. The lower panel zooms to times 1 through 9 and derivative values -0.012 through 0.03 to reveal repeated sign changes. Global peak and first-crossing certificates are stored independently of the plotted grid.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <ns2:Agent>
      <dc:title>Saved-evidence plotting source</dc:title>
     </ns2:Agent>
    </dc:creator>
   </ns2:Work>
  </rdf:RDF>
 </metadata>
