<text x="73.000" y="217.000" text-anchor="start" font-family="Arial, sans-serif" font-size="8.1" font-weight="700" fill="#111111">Stressed diagonal contrast</text>
<text x="73.000" y="236.000" text-anchor="start" font-family="Arial, sans-serif" font-size="7.0" font-weight="400" fill="#111111">gap 0.611148; alpha 0.104080</text>
