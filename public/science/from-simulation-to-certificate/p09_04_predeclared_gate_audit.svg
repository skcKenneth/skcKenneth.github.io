<text x="415.000" y="217.000" text-anchor="start" font-family="Arial, sans-serif" font-size="8.1" font-weight="700" fill="#111111">Grid sensitivity</text>
<text x="415.000" y="236.000" text-anchor="start" font-family="Arial, sans-serif" font-size="7.0" font-weight="400" fill="#111111">max abs. diff. 6.76e-05 &lt;= 0.001</text>
<text x="670.000" y="220.000" text-anchor="end" font-family="Arial, sans-serif" font-size="7.0" font-weight="700" fill="#111111">PASS</text>
