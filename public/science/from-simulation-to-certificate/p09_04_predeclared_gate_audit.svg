<text x="42.000" y="309.000" text-anchor="start" font-family="Arial, sans-serif" font-size="7.1" font-weight="400" fill="#111111">max eigenvalue: diagonal -8.634e-11 | full -1.264e-10 | required &lt;= 1e-10</text>
<text x="42.000" y="321.000" text-anchor="start" font-family="Arial, sans-serif" font-size="6.5" font-weight="400" fill="#111111">Negative values mean the checked endpoint inequalities retain margin.</text>
<rect x="466.000" y="274.000" width="222.000" height="53.000" rx="4.000" fill="#E8E0F0" stroke="#6F4C9B" stroke-width="1.1"/>
<text x="577.000" y="292.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.3" font-weight="700" fill="#111111">PHASE-1 VERDICT: PASS</text>
<text x="577.000" y="309.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="6.8" font-weight="400" fill="#111111">canonical = rerun, byte-for-byte</text>
<text x="577.000" y="321.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="6.5" font-weight="400" fill="#111111">REFRAME literature gate retained</text>
<text x="358.000" y="345.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="6.8" font-weight="700" fill="#111111">Locked: no theorem, global SDP optimum, scaling, physical validation, or universal superiority claim</text>
</svg>
