<svg xmlns="http://www.w3.org/2000/svg" width="716" height="360" viewBox="0 0 716 360">
<title>P09 predeclared gate and residual audit</title>
<desc>Six frozen gates, endpoint residual margins, and grid-sensitivity values are shown with the benchmark-specific PASS verdict and locked claim boundary.</desc>
