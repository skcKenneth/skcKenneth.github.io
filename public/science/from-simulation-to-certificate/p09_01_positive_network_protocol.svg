<text x="242.000" y="239.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="400" fill="#111111">removal r2</text>
<rect x="40.000" y="263.000" width="266.000" height="43.000" rx="3.000" fill="#FFF4D6" stroke="#C49A00" stroke-width="0.8"/>
<text x="173.000" y="278.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.3" font-weight="700" fill="#111111">A is Metzler; column leakage = (r1, r2) &gt; 0</text>
<text x="173.000" y="294.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.0" font-weight="400" fill="#111111">s contracts endpoints to midpoint; theta mixes them</text>
