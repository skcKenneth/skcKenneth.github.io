<svg xmlns="http://www.w3.org/2000/svg" width="716" height="360" viewBox="0 0 716 360">
<title>P09 frozen positive-network certificate protocol</title>
<desc>Two leaky compartments, two uncertain endpoints, stress contraction, finite spectral diagnostics, and verified quadratic endpoint inequalities.</desc>
