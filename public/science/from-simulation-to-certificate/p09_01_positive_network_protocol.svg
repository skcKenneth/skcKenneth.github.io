<text x="370.000" y="107.000" text-anchor="start" font-family="Arial, sans-serif" font-size="7.1" font-weight="400" fill="#111111">Diagnostic only: uncovered theta values remain</text>
<rect x="350.000" y="125.000" width="348.000" height="74.000" rx="5.000" fill="#D7EBF5" stroke="#0072B2" stroke-width="1.3"/>
<rect x="350.000" y="125.000" width="8.000" height="74.000" rx="4.000" fill="#0072B2" stroke="none" stroke-width="0.8"/>
<text x="370.000" y="145.000" text-anchor="start" font-family="Arial, sans-serif" font-size="9.2" font-weight="700" fill="#111111">Diagonal quadratic construction</text>
<text x="370.000" y="164.000" text-anchor="start" font-family="Arial, sans-serif" font-size="7.4" font-weight="400" fill="#111111">P=diag(p,1-p), trace(P)=1</text>
<text x="370.000" y="180.000" text-anchor="start" font-family="Arial, sans-serif" font-size="7.1" font-weight="400" fill="#111111">Restricted shape; endpoint residuals verified</text>
<rect x="350.000" y="211.000" width="348.000" height="74.000" rx="5.000" fill="#D6EEE6" stroke="#009E73" stroke-width="1.3"/>
<rect x="350.000" y="211.000" width="8.000" height="74.000" rx="4.000" fill="#009E73" stroke="none" stroke-width="0.8"/>
<text x="370.000" y="231.000" text-anchor="start" font-family="Arial, sans-serif" font-size="9.2" font-weight="700" fill="#111111">Full quadratic construction</text>
<text x="370.000" y="250.000" text-anchor="start" font-family="Arial, sans-serif" font-size="7.4" font-weight="400" fill="#111111">P=[[p,q],[q,1-p]], trace(P)=1</text>
<text x="370.000" y="266.000" text-anchor="start" font-family="Arial, sans-serif" font-size="7.1" font-weight="400" fill="#111111">Endpoint LMIs certify every convex mixture</text>
<rect x="350.000" y="297.000" width="348.000" height="26.000" rx="3.000" fill="#FDE9E5" stroke="#D55E00" stroke-width="1.0"/>
<text x="524.000" y="313.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.2" font-weight="700" fill="#111111">Feasible grid construction; no global SDP-optimum claim</text>
<text x="690.000" y="344.000" text-anchor="end" font-family="Arial, sans-serif" font-size="6.6" font-weight="400" fill="#111111">Synthetic Phase-1 | config SHA c1c20c5e...e1ebc4</text>
</svg>
