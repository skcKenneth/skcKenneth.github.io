<line x1="102.000" y1="188.000" x2="102.000" y2="224.000" stroke="#0072B2" stroke-width="1.3"/>
<polygon points="102.000,224.000 99.000,218.000 105.000,218.000" fill="#0072B2" stroke="none" stroke-width="0.8"/>
