<text x="242.000" y="148.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#111111">x2</text>
<text x="242.000" y="164.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="400" fill="#111111">compartment 2</text>
