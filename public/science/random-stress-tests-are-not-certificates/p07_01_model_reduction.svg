<svg xmlns="http://www.w3.org/2000/svg" width="515.520pt" height="273.600pt" viewBox="0 0 515.520 273.600">
<title>Synthetic model and monotonicity reduction</title>
<desc>Declared uncertainty box, derivative-sign reduction, and certificate definition.</desc>
<rect x="0.000" y="0.000" width="515.520" height="273.600" fill="#FFFFFF" stroke="none" stroke-width="0.000"/>
<text x="257.760" y="16.000" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10.000pt" font-weight="700" text-anchor="middle">Synthetic CSTR proxy: proved monotonicity reduces a 3-D box to one interval</text>
<text x="22.000" y="37.700" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.700pt" font-weight="700" text-anchor="start">(a) Declared uncertainty and analytic reduction</text>
<rect x="24.000" y="52.000" width="112.000" height="45.000" fill="#D7EAF5" stroke="#000000" stroke-width="0.600"/>
<text x="80.000" y="69.000" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.000pt" font-weight="700" text-anchor="middle">T in [0.4, 2.0]</text>
<text x="80.000" y="84.200" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.200pt" font-weight="400" text-anchor="middle">state coordinate</text>
<rect x="151.000" y="52.000" width="112.000" height="45.000" fill="#F7DFD3" stroke="#000000" stroke-width="0.600"/>
<text x="207.000" y="69.000" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.000pt" font-weight="700" text-anchor="middle">z in [-28, -20]</text>
<text x="207.000" y="84.200" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.200pt" font-weight="400" text-anchor="middle">log kinetic intensity</text>
<rect x="278.000" y="52.000" width="112.000" height="45.000" fill="#D9F0E8" stroke="#000000" stroke-width="0.600"/>
<text x="334.000" y="69.000" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.000pt" font-weight="700" text-anchor="middle">H in [0.5, 2.0]</text>
<text x="334.000" y="84.200" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.200pt" font-weight="400" text-anchor="middle">heat removal</text>
<line x1="397.000" y1="74.000" x2="433.000" y2="74.000" stroke="#000000" stroke-width="1.000"/>
<line x1="426.000" y1="69.000" x2="433.000" y2="74.000" stroke="#000000" stroke-width="1.000"/>
<line x1="426.000" y1="79.000" x2="433.000" y2="74.000" stroke="#000000" stroke-width="1.000"/>
<rect x="439.000" y="47.000" width="55.000" height="54.000" fill="#F3E1EE" stroke="#000000" stroke-width="0.700"/>
<text x="466.500" y="62.500" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.500pt" font-weight="700" text-anchor="middle">z = -20</text>
<text x="466.500" y="77.500" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.500pt" font-weight="700" text-anchor="middle">H = 0.5</text>
<text x="466.500" y="92.500" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.500pt" font-weight="400" text-anchor="middle">search T</text>
<text x="151.000" y="116.600" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.600pt" font-weight="700" text-anchor="middle">dJ/dz &gt; 0</text>
<text x="278.000" y="116.600" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.600pt" font-weight="700" text-anchor="middle">dJ/dH &lt; 0</text>
<text x="22.000" y="138.700" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.700pt" font-weight="700" text-anchor="start">(b) Certificate definition</text>
<rect x="25.000" y="153.000" width="143.000" height="61.000" fill="#D7EAF5" stroke="#000000" stroke-width="0.650"/>
<text x="96.500" y="172.400" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.400pt" font-weight="700" text-anchor="middle">Incumbent LB</text>
<text x="96.500" y="191.200" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.200pt" font-weight="400" text-anchor="middle">evaluated feasible point</text>
<rect x="186.000" y="153.000" width="143.000" height="61.000" fill="#F7DFD3" stroke="#000000" stroke-width="0.650"/>
<text x="257.500" y="172.400" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.400pt" font-weight="700" text-anchor="middle">Interval UB</text>
<text x="257.500" y="191.200" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.200pt" font-weight="400" text-anchor="middle">valid for every T in box</text>
<rect x="347.000" y="153.000" width="143.000" height="61.000" fill="#D9F0E8" stroke="#000000" stroke-width="0.650"/>
<text x="418.500" y="172.400" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.400pt" font-weight="700" text-anchor="middle">Stop rule</text>
<text x="418.500" y="191.200" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.200pt" font-weight="400" text-anchor="middle">UB - LB &lt;= 1e-6</text>
<text x="257.760" y="239.000" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.000pt" font-weight="400" text-anchor="middle">J(T,z,H) = T_feed - T + B sigmoid(z + aT/(1+T)) - H(T - T_cool)</text>
<text x="257.760" y="259.400" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.400pt" font-weight="400" text-anchor="middle">Algebraic, dimensionless, synthetic proxy only; not a physical runaway or plant-safety certificate.</text>
</svg>
