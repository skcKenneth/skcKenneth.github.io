<svg xmlns="http://www.w3.org/2000/svg" width="515.520pt" height="273.600pt" viewBox="0 0 515.520 273.600">
<title>Frozen fast-slow model and AP properties</title>
<desc>Dimensionless Michaelis-Menten equations, invariant, audited update, and evidence boundaries.</desc>
<rect x="0.000" y="0.000" width="515.520" height="273.600" fill="#FFFFFF" stroke="none" stroke-width="0.000"/>
<text x="257.760" y="16.000" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10.000pt" font-weight="700" text-anchor="middle">A frozen fast-slow enzyme system separates proved structure from observed accuracy</text>
<text x="28.000" y="39.700" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.700pt" font-weight="700" text-anchor="start">(a) Dimensionless full model</text>
<rect x="28.000" y="55.000" width="137.000" height="60.000" fill="#D7EAF5" stroke="#000000" stroke-width="0.650"/>
<text x="96.500" y="73.200" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.200pt" font-weight="700" text-anchor="middle">slow substrate</text>
<text x="96.500" y="94.200" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.200pt" font-weight="400" text-anchor="middle">s&#x27; = -s + (s + alpha)c</text>
<rect x="189.000" y="55.000" width="137.000" height="60.000" fill="#F7DFD3" stroke="#000000" stroke-width="0.650"/>
<text x="257.500" y="73.200" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.200pt" font-weight="700" text-anchor="middle">fast complex</text>
<text x="257.500" y="94.200" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.200pt" font-weight="400" text-anchor="middle">eps c&#x27; = s - (s + K)c</text>
<rect x="350.000" y="55.000" width="137.000" height="60.000" fill="#D9F0E8" stroke="#000000" stroke-width="0.650"/>
<text x="418.500" y="73.200" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.200pt" font-weight="700" text-anchor="middle">product</text>
<text x="418.500" y="94.200" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.200pt" font-weight="400" text-anchor="middle">p&#x27; = beta c</text>
<text x="257.760" y="133.700" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.700pt" font-weight="700" text-anchor="middle">Exact invariant: s + eps c + p = 1; initial state (1, 0, 0); K = alpha + beta = 1</text>
<text x="28.000" y="159.700" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.700pt" font-weight="700" text-anchor="start">(b) Audited linearly implicit update</text>
<rect x="28.000" y="176.000" width="142.000" height="54.000" fill="#F3E1EE" stroke="#000000" stroke-width="0.650"/>
<text x="99.000" y="193.100" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.100pt" font-weight="700" text-anchor="middle">coupled step</text>
<text x="99.000" y="212.000" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.000pt" font-weight="400" text-anchor="middle">lagged coefficient; solve for c(n+1)</text>
<rect x="188.000" y="176.000" width="142.000" height="54.000" fill="#D9F0E8" stroke="#000000" stroke-width="0.650"/>
<text x="259.000" y="193.100" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.100pt" font-weight="700" text-anchor="middle">proved properties</text>
<text x="259.000" y="212.000" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.000pt" font-weight="400" text-anchor="middle">nonnegative; c &lt;= 1; invariant</text>
<rect x="348.000" y="176.000" width="139.000" height="54.000" fill="#D7EAF5" stroke="#000000" stroke-width="0.650"/>
<text x="417.500" y="193.100" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.100pt" font-weight="700" text-anchor="middle">fixed-step limit</text>
<text x="417.500" y="212.000" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.000pt" font-weight="400" text-anchor="middle">correct reduced discrete update</text>
<text x="257.760" y="253.500" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="7.500pt" font-weight="700" text-anchor="middle">Replication/property audit only: no new solver, uniformly-accurate theorem, parameter fit, or biological validation.</text>
</svg>
