<svg xmlns="http://www.w3.org/2000/svg" width="716" height="360" viewBox="0 0 716 360">
<title>P06 observation-operator protocol</title>
<desc>Synthetic six-patch SIR truth mapped to direct latent, correct aggregated delayed, and deliberately misspecified observation arms.</desc>
<rect width="716" height="360" fill="#FFFFFF"/>
<text x="18.000" y="19.000" text-anchor="start" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#111111">a</text>
<text x="54.000" y="19.000" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111111">What the filter sees is not what the model stores</text>
<text x="54.000" y="35.000" text-anchor="start" font-family="Arial, sans-serif" font-size="7.5" font-weight="400" fill="#111111">One truth and prior; only the observation stream/operator differ across EnKF arms</text>
<rect x="18.000" y="52.000" width="290.000" height="275.000" rx="5.000" fill="#F8F8F8" stroke="#B5B5B5" stroke-width="0.8"/>
<text x="32.000" y="72.000" text-anchor="start" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#111111">Latent six-patch metapopulation</text>
<line x1="161.000" y1="93.000" x2="228.550" y2="132.000" stroke="#999999" stroke-width="1.0" stroke-dasharray="6 4"/>
<line x1="228.550" y1="132.000" x2="228.550" y2="210.000" stroke="#999999" stroke-width="1.0" stroke-dasharray="6 4"/>
<line x1="228.550" y1="210.000" x2="161.000" y2="249.000" stroke="#999999" stroke-width="1.0" stroke-dasharray="6 4"/>
<line x1="161.000" y1="249.000" x2="93.450" y2="210.000" stroke="#999999" stroke-width="1.0" stroke-dasharray="6 4"/>
<line x1="93.450" y1="210.000" x2="93.450" y2="132.000" stroke="#999999" stroke-width="1.0" stroke-dasharray="6 4"/>
<line x1="93.450" y1="132.000" x2="161.000" y2="93.000" stroke="#999999" stroke-width="1.0" stroke-dasharray="6 4"/>
<circle cx="161.000" cy="93.000" r="17.000" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.3"/>
<text x="161.000" y="96.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#111111">I1</text>
<circle cx="228.550" cy="132.000" r="17.000" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.3"/>
<text x="228.550" y="135.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#111111">I2</text>
<circle cx="228.550" cy="210.000" r="17.000" fill="#FFFFFF" stroke="#009E73" stroke-width="2.3"/>
<text x="228.550" y="213.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#111111">I3</text>
<circle cx="161.000" cy="249.000" r="17.000" fill="#FFFFFF" stroke="#009E73" stroke-width="2.3"/>
<text x="161.000" y="252.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#111111">I4</text>
<circle cx="93.450" cy="210.000" r="17.000" fill="#FFFFFF" stroke="#6F4C9B" stroke-width="2.3"/>
<text x="93.450" y="213.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#111111">I5</text>
<circle cx="93.450" cy="132.000" r="17.000" fill="#FFFFFF" stroke="#6F4C9B" stroke-width="2.3"/>
<text x="93.450" y="135.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#111111">I6</text>
<text x="161.000" y="166.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#111111">SIR state</text>
<text x="161.000" y="179.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#111111">+ q0,q1,q2</text>
<text x="161.000" y="270.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.2" font-weight="400" fill="#111111">Ring mixing; patch population = 10,000</text>
<text x="161.000" y="283.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.2" font-weight="700" fill="#111111">Deterministic synthetic truth; no dengue data</text>
<rect x="34.000" y="299.000" width="255.000" height="17.000" rx="3.000" fill="#FFF4D6" stroke="#C49A00" stroke-width="0.8"/>
<text x="161.000" y="310.000" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.2" font-weight="700" fill="#111111">Shared 96-member prior and frozen seeds</text>
<rect x="332.000" y="52.000" width="366.000" height="79.000" rx="5.000" fill="#D7EBF5" stroke="#0072B2" stroke-width="1.4"/>
<rect x="332.000" y="52.000" width="8.000" height="79.000" rx="4.000" fill="#0072B2" stroke="none" stroke-width="0.8"/>
<text x="352.000" y="72.000" text-anchor="start" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#111111">Direct latent comparator</text>
<text x="352.000" y="92.000" text-anchor="start" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#111111">y = [I1,...,I6] + noise</text>
<text x="352.000" y="109.000" text-anchor="start" font-family="Arial, sans-serif" font-size="7.4" font-weight="400" fill="#111111">Unrealistically informative</text>
<rect x="332.000" y="143.000" width="366.000" height="91.000" rx="5.000" fill="#D6EEE6" stroke="#009E73" stroke-width="1.4"/>
<rect x="332.000" y="143.000" width="8.000" height="91.000" rx="4.000" fill="#009E73" stroke="none" stroke-width="0.8"/>
<text x="352.000" y="163.000" text-anchor="start" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#111111">Correct aggregate + delay</text>
<text x="352.000" y="183.000" text-anchor="start" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#111111">pairs (1+2),(3+4),(5+6)</text>
<text x="352.000" y="200.000" text-anchor="start" font-family="Arial, sans-serif" font-size="7.4" font-weight="400" fill="#111111">0.15 q0 + 0.35 q1 + 0.50 q2; rho=0.62</text>
<rect x="332.000" y="246.000" width="366.000" height="81.000" rx="5.000" fill="#F6DED4" stroke="#D55E00" stroke-width="1.4"/>
<rect x="332.000" y="246.000" width="8.000" height="81.000" rx="4.000" fill="#D55E00" stroke="none" stroke-width="0.8"/>
<text x="352.000" y="266.000" text-anchor="start" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#111111">Deliberately misspecified</text>
<text x="352.000" y="286.000" text-anchor="start" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#111111">pairs (1+4),(2+5),(3+6)</text>
<text x="352.000" y="303.000" text-anchor="start" font-family="Arial, sans-serif" font-size="7.4" font-weight="700" fill="#111111">no delay; rho=0.82; same observed stream</text>
<line x1="291.000" y1="116.000" x2="327.000" y2="91.000" stroke="#0072B2" stroke-width="1.2" stroke-dasharray="6 4"/>
<polygon points="327.000,91.000 323.783,96.886 320.361,91.958" fill="#0072B2" stroke="none" stroke-width="0.8"/>
<line x1="291.000" y1="171.000" x2="327.000" y2="187.000" stroke="#009E73" stroke-width="1.2"/>
<polygon points="327.000,187.000 320.299,187.305 322.736,181.822" fill="#009E73" stroke="none" stroke-width="0.8"/>
<line x1="291.000" y1="224.000" x2="327.000" y2="281.000" stroke="#D55E00" stroke-width="1.2" stroke-dasharray="6 4"/>
<polygon points="327.000,281.000 321.260,277.529 326.333,274.325" fill="#D55E00" stroke="none" stroke-width="0.8"/>
<text x="683.000" y="338.000" text-anchor="end" font-family="Arial, sans-serif" font-size="7" font-weight="400" fill="#111111">Assimilation days 2–44; held-out forecast to day 100</text>
</svg>
