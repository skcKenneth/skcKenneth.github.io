<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="7.16in" height="3.15in" viewBox="0 0 515.520 226.800" role="img" aria-labelledby="title desc">
<title id="title">FSP truncation audit at a fixed overflow tolerance</title>
<desc id="desc">The recorded cap-18 failed attempt and cap-20 passing attempt, compared on a logarithmic overflow-probability scale without relaxing tolerance.</desc>
<rect x="0.000" y="0.000" width="515.520" height="226.800" fill="#FFFFFF"/>
<text x="257.760" y="18.000" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10.000" font-weight="700" text-anchor="middle">FSP truncation audit: fixed tolerance, enlarged cap</text>
<line x1="145.000" y1="57.569" x2="375.000" y2="128.989" stroke="#4D4D4D" stroke-width="1.000" stroke-dasharray="4 3"/>
<line x1="100.000" y1="52.000" x2="100.000" y2="181.000" stroke="#202020" stroke-width="0.800"/>
<line x1="100.000" y1="181.000" x2="420.000" y2="181.000" stroke="#202020" stroke-width="0.800"/>
<line x1="100.000" y1="181.000" x2="420.000" y2="181.000" stroke="#D9D9D9" stroke-width="0.500"/>
<line x1="97.000" y1="181.000" x2="100.000" y2="181.000" stroke="#202020" stroke-width="0.800"/>
<text x="92.000" y="185.500" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.500" font-weight="400" text-anchor="end">1e-10</text>
<line x1="100.000" y1="138.000" x2="420.000" y2="138.000" stroke="#D9D9D9" stroke-width="0.500"/>
<line x1="97.000" y1="138.000" x2="100.000" y2="138.000" stroke="#202020" stroke-width="0.800"/>
<text x="92.000" y="142.500" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.500" font-weight="400" text-anchor="end">1e-9</text>
<line x1="100.000" y1="95.000" x2="420.000" y2="95.000" stroke="#D9D9D9" stroke-width="0.500"/>
<line x1="97.000" y1="95.000" x2="100.000" y2="95.000" stroke="#202020" stroke-width="0.800"/>
<text x="92.000" y="99.500" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.500" font-weight="400" text-anchor="end">1e-8</text>
<line x1="100.000" y1="52.000" x2="420.000" y2="52.000" stroke="#D9D9D9" stroke-width="0.500"/>
<line x1="97.000" y1="52.000" x2="100.000" y2="52.000" stroke="#202020" stroke-width="0.800"/>
<text x="92.000" y="56.500" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.500" font-weight="400" text-anchor="end">1e-7</text>
<line x1="100.000" y1="95.000" x2="420.000" y2="95.000" stroke="#4D4D4D" stroke-width="1.200" stroke-dasharray="4 3"/>
<text x="418.000" y="89.500" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.500" font-weight="400" text-anchor="end">fixed tolerance = 1e-8</text>
<line x1="140.000" y1="52.569" x2="150.000" y2="62.569" stroke="#D55E00" stroke-width="1.500"/>
<line x1="140.000" y1="62.569" x2="150.000" y2="52.569" stroke="#D55E00" stroke-width="1.500"/>
<text x="145.000" y="199.000" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="9.000" font-weight="700" text-anchor="middle">18</text>
<text x="193.000" y="74.069" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.500" font-weight="700" text-anchor="start">FAIL: 7.42e-08</text>
<polygon points="375.000,122.989 381.000,128.989 375.000,134.989 369.000,128.989" fill="#FFFFFF" stroke="#009E73" stroke-width="1.500"/>
<text x="375.000" y="199.000" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="9.000" font-weight="700" text-anchor="middle">20</text>
<text x="375.000" y="116.489" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.500" font-weight="700" text-anchor="middle">PASS: 1.62e-09</text>
<text x="100.000" y="45.500" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.500" font-weight="700" text-anchor="start">FSP overflow probability (log scale)</text>
<text x="260.000" y="208.000" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="9.000" font-weight="400" text-anchor="middle">Molecule cap per species</text>
<text x="257.760" y="218.500" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.500" font-weight="400" text-anchor="middle">Only the cap changed (18 to 20); the 1e-8 error tolerance was not relaxed.</text>
</svg>
